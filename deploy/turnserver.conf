listening-port=3478
listening-ip=0.0.0.0
relay-ip=0.0.0.0
# 公网 IP：部署时改成你自己的服务器 IP（勿提交真实 IP 到公开仓库）
# 可用环境变量 PIERCER_PUBLIC_IP 覆盖代码中的默认值
external-ip=YOUR_SERVER_IP
realm=piercer-file-transfer
fingerprint
no-tls
no-dtls
no-cli
lt-cred-mech
# TURN 账号：真实密码绝不提交！部署时改成强随机密码，
# 并同步设置 common 的环境变量 PIERCER_TURN_PASS
# 生成强密码示例：openssl rand -base64 24
user=piercer:CHANGE_ME_SET_STRONG_PASSWORD
min-port=49150
max-port=49200
no-multicast-peers
stale-nonce=600
verbose
